name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, coverage, and security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking gate: only dependencies that ship to the Worker.
      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      # Advisory only. The dev toolchain currently pulls a vulnerable
      # brace-expansion through minimatch@3, which eslint and
      # eslint-config-next depend on internally. brace-expansion 5.0.8 is the
      # only fixed release and its API breaks minimatch@3, so there is no fix
      # available until those packages move upstream. Kept visible so the
      # finding is not silently lost, but it does not block merges on a
      # build-time-only DoS advisory.
      - name: Security audit (all dependencies, non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright integration tests
        run: npm run test:e2e -- --project=chromium

      - name: Build
        run: npm run build

      - name: Build Cloudflare worker
        run: npm run cf:build
